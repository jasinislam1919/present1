<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lilium Orientalis — Compiled in Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020205;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f4eef2;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 42%, #0a0912 0%, #030307 58%, #010102 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(1, 1, 3, 0.78) 100%);
      z-index: 2;
    }

    .hud-header {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
    }

    .hud-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.95rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d8e8dc;
      font-weight: 500;
    }

    .hud-sub {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: rgba(216, 232, 220, 0.52);
      margin-top: 3px;
      text-transform: uppercase;
    }

    .controls-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14, 14, 22, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #f3e8ee;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 130, 175, 0.16);
      border-color: rgba(255, 130, 175, 0.45);
      color: #ffffff;
    }

    .btn.active {
      background: rgba(255, 105, 160, 0.24);
      border-color: rgba(255, 145, 185, 0.65);
      color: #ffe3ee;
    }

    .progress-pill {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: rgba(235, 225, 232, 0.65);
      padding: 0 8px;
      min-width: 96px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .hud-header {
        top: 14px;
        left: 14px;
      }
      .controls-bar {
        bottom: 16px;
        gap: 6px;
        padding: 5px 8px;
      }
      .btn {
        padding: 7px 12px;
        font-size: 0.72rem;
      }
      .progress-pill {
        min-width: 82px;
        font-size: 0.65rem;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <header class="hud-header">
    <div class="hud-title">Lilium Orientalis</div>
    <div class="hud-sub" id="phase-label">Phase I · Cellular Lattice</div>
  </header>

  <div class="controls-bar">
    <button class="btn" id="replay-btn" title="Replay Animation">↻ Replay</button>
    <span class="progress-pill" id="stage-status">Growing...</span>
    <button class="btn" id="rotate-btn" title="Toggle Auto Orbit">⟳ Orbit</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
